      - name: Build presentations
        shell: bash
        run: |
          set -e

          find slides -type f -name "slides.md" | while read -r file; do
            relative="${file#slides/}"
            directory="$(dirname "$relative")"

            echo "========================================"
            echo "Building: $file"
            echo "Output expected: dist/$directory"
            echo "========================================"

            npx slidev build "$file" \
              --out "dist/$directory" \
              --base "/${{ github.event.repository.name }}/$directory/"

            echo ""
            echo "===== ROOT ====="
            find . -maxdepth 4 -type f | sort | head -200

            echo ""
            echo "===== DIST ====="
            if [ -d dist ]; then
              find dist -maxdepth 6 -type f | sort
            else
              echo "dist does not exist"
            fi

            echo ""
            echo "===== SEARCH INDEX ====="
            find . -type f -name "index.html" -not -path "./node_modules/*" | sort
          done