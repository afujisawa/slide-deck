name: Deploy Slidev Presentations

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ========================================
      # Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # Node.js
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ========================================
      # Dependências
      # ========================================
      - name: Install dependencies
        run: npm ci

      # ========================================
      # Preparar dist
      # ========================================
      - name: Prepare dist
        run: |
          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"

      # ========================================
      # Build de todas as apresentações
      # ========================================
      - name: Build presentations
        shell: bash
        run: |
          set -e

          find slides -type f -name "slides.md" | while read -r file; do

            relative="${file#slides/}"
            directory="$(dirname "$relative")"

            output="$GITHUB_WORKSPACE/dist/$directory"

            echo ""
            echo "========================================"
            echo "Building: $file"
            echo "Output:   $output"
            echo "Base:     /${{ github.event.repository.name }}/$directory/"
            echo "========================================"
            echo ""

            mkdir -p "$output"

            npx slidev build "$file" \
              --out "$output" \
              --base "/${{ github.event.repository.name }}/$directory/"

            if [ -d "$(dirname "$file")/images" ]; then
              cp -R "$(dirname "$file")/images" "$output/images"
            fi

            echo ""
            echo "Generated files:"
            find "$output" -maxdepth 3 -type f | sort

            echo ""

          done

      # ========================================
      # Verificar resultado
      # ========================================
      - name: Verify build
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINAL DIST"
          echo "========================================"

          find "$GITHUB_WORKSPACE/dist" -type f | sort

          echo ""
          echo "========================================"
          echo "INDEX FILES"
          echo "========================================"

          find "$GITHUB_WORKSPACE/dist" \
            -type f \
            -name "index.html" \
            | sort

          echo ""
          echo "========================================"
          echo "DIST SIZE"
          echo "========================================"

          du -ah "$GITHUB_WORKSPACE/dist" | sort -h

          echo ""
          echo "========================================"
          echo "Checking expected presentation"
          echo "========================================"

          test -f "$GITHUB_WORKSPACE/dist/lds/ed/2026-09-13/index.html"

          echo "OK: presentation index.html exists"

      # ========================================
      # Configurar GitHub Pages
      # ========================================
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ========================================
      # Upload do artefato
      # ========================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # ========================================
      # Deploy
      # ========================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4