name: Deploy Slidev Presentations

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist

      - name: Build presentations
        shell: bash
        run: |
          set -e

          find slides -type f -name "slides.md" | while read -r file; do
            relative="${file#slides/}"
            directory="$(dirname "$relative")"

            echo "========================================"
            echo "Building: $file"
            echo "Output:   dist/$directory"
            echo "Base:     /${{ github.event.repository.name }}/$directory/"
            echo "========================================"

            npx slidev build "$file" \
              --out "dist/$directory" \
              --base "/${{ github.event.repository.name }}/$directory/"

            echo ""
            echo "Generated files:"
            find "dist/$directory" -maxdepth 2 -type f | head -30
            echo ""
          done

      - name: Verify build
        shell: bash
        run: |
          set -e

          echo "Contents of dist:"
          find dist -type f | sort

          echo ""
          echo "Checking presentation..."

          test -f "dist/lds/ed/2026-09-13/index.html"

          echo "OK: index.html exists"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4